name: drawkit
description: >-
  Animated hand-drawn UI for Flutter: real widgets on top, seeded pen strokes
  behind, one shared boil clock — the Dart port of drawably with zero
  dependencies beyond the Flutter SDK.
version: 0.1.1
homepage: https://github.com/sandkshnbh/drawkit
repository: https://github.com/sandkshnbh/drawkit
issue_tracker: https://github.com/sandkshnbh/drawkit/issues
topics:
  - ui
  - hand-drawn
  - animation
  - widgets

environment:
  sdk: ^3.13.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Opt-in, like `drawably/font.css`: nothing uses the family unless a style
  # asks for it. The TTF ships in the package (31 KB).
  fonts:
    - family: DrawkitPen
      fonts:
        - asset: fonts/DrawkitPen.ttf
